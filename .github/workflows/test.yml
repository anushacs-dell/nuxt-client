name: Run Tests

on:
  push:
    branches: [ run-tests ]
  pull_request:
    branches: [ run-tests ]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Download CWL files
        run: |
          mkdir -p tests/fixtures

          REPOS=(
            "eoap/application-package-patterns/cwl-workflow"
            "GeoLabs/KindGrove"
          )

          for repo_path in "${REPOS[@]}"; do
            REPO=$(echo $repo_path | cut -d'/' -f1,2)
            SUB_PATH=$(echo $repo_path | cut -d'/' -f3-)

            if [ -z "$SUB_PATH" ]; then
              API_URL="https://api.github.com/repos/$REPO/contents"
            else
              API_URL="https://api.github.com/repos/$REPO/contents/$SUB_PATH"
            fi

            echo "Fetching from $API_URL"

            curl -s $API_URL \
            | jq -r '.[] | select(.name | endswith(".cwl")) | .download_url' \
            | while read url; do
                filename=$(basename $url)

                echo "Downloading $filename from $REPO"

                curl -L $url -o tests/fixtures/${REPO//\//-}-$filename
              done
          done

          if [ -z "$(ls -A tests/fixtures)" ]; then
            echo "❌ No CWL files downloaded!"
            exit 1
          fi

      - name: Run tests
        run: npm run test
